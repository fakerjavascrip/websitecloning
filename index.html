<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>逆水寒 新MMO 新世界</title>
  <style>
    :root {
      --bg: #f4f2ed;
      --surface: #fffcf7;
      --navy: #1a2d4a;
      --navy-soft: #2c3f5c;
      --text: #3d3d3d;
      --accent: #c45c26;
      --accent-soft: #d4783c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(20px, 4vw, 56px) clamp(16px, 3vw, 32px) 48px;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .shell {
      width: 100%;
      max-width: 960px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 20px;
      padding: clamp(28px, 4vw, 48px) clamp(20px, 4vw, 56px) clamp(28px, 4vw, 40px);
      text-align: center;
      box-shadow: 0 12px 40px rgba(26, 45, 74, 0.06);
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: clamp(11px, 1.1vw, 13px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.65rem, 2.2vw + 1rem, 2.35rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.3;
    }

    .tagline {
      margin: 0 0 clamp(22px, 3vw, 32px);
      font-size: clamp(14px, 1.2vw, 16px);
      color: var(--navy-soft);
    }

    /* 虚线外框与图片留缝 + 大图圆角 */
    .hero-frame {
      margin: 0 auto clamp(22px, 3vw, 28px);
      max-width: 100%;
      padding: 10px;
      border: 2px dashed var(--accent-soft);
      border-radius: 24px;
      background: linear-gradient(180deg, #fff9f0 0%, #fff 100%);
    }

    .hero-inner {
      border-radius: 16px;
      overflow: hidden;
      line-height: 0;
    }

    .hero-inner img {
      display: block;
      width: 100%;
      height: auto;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: clamp(20px, 2.5vw, 28px);
    }

    .pill {
      padding: 8px 20px;
      border: 1px solid var(--navy);
      border-radius: 999px;
      font-size: clamp(13px, 1vw, 15px);
      font-weight: 600;
      color: var(--navy);
      background: #fff;
    }

    .body-text {
      margin: 0 auto 14px;
      max-width: 52em;
      font-size: clamp(15px, 1.1vw, 17px);
      line-height: 1.85;
      color: var(--text);
    }

    .kw {
      color: var(--accent);
      font-weight: 700;
    }

    .closing {
      margin: 0 auto clamp(24px, 3vw, 32px);
      max-width: 42em;
      font-size: clamp(14px, 1vw, 16px);
      color: var(--navy-soft);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 520px;
      margin: 0 auto;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      text-decoration: none;
      font-size: clamp(15px, 1vw, 17px);
      font-weight: 700;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn:hover {
      background: #152338;
    }

    .btn:active {
      transform: scale(0.99);
    }

    /* PC：底部双按钮并排 */
    @media (min-width: 640px) {
      .actions {
        flex-direction: row;
        max-width: none;
      }
    }

    @media (min-width: 900px) {
      .card {
        max-width: 780px;
        padding-left: 64px;
        padding-right: 64px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <article class="card">
      <p class="eyebrow">Sword of Justice：World</p>
      <h1>逆水寒 新MMO 新世界</h1>
      <p class="tagline">世界焕然万物出金</p>

      <div class="hero-frame">
        <div class="hero-inner">
          <img src="assets/hero.png" alt="逆水寒 场景" width="1200" height="675" />
        </div>
      </div>

      <div class="pills">
        <span class="pill">新画质</span>
        <span class="pill">新故事</span>
        <span class="pill">新天地</span>
      </div>

      <p class="body-text">
        让MMO再次伟大，展开<span class="kw">极致光影</span>、<span class="kw">生动玩法</span>、<span class="kw">战斗轻松</span>的<span class="kw">江湖冒险</span>
      </p>
      <p class="closing">所有江湖偶遇都是宿命相逢。</p>

      <div class="actions">
        <a class="btn" href="https://h.163.com" target="_blank" rel="noopener noreferrer">步入江湖</a>
        <a class="btn" href="https://m.ds.163.com/" target="_blank" rel="noopener noreferrer">试剑天下</a>
      </div>
    </article>
  </div>
</body>
</html>
